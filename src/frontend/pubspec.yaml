name: english_for_kids
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: 9.2.4
  audioplayers: ^6.7.1
  speech_to_text: 7.0.0
  google_sign_in: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/vocabulary/
    - assets/images/
    - assets/audio/ingles/
    - assets/audio/espanol/
    - assets/personajes/nino/
    - assets/personajes/nina/